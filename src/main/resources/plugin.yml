name: CombatLock
version: '${project.version}'
main: uk.co.pembo.combatlock.CombatLockPlugin
api-version: '26.2'
author: Dave
description: Locks aggressors and defenders out of configured commands and elytra for a set time after PvP combat.

commands:
  combatlock:
    description: Manage CombatLock's configuration
    usage: /combatlock <reload|debug>

permissions:
  combatlock.bypass:
    description: Never gets combat-locked, command-blocked, or elytra-restricted
    default: op
  combatlock.reload:
    description: Reload CombatLock's configuration
    default: op
