# CombatLock configuration
# Reload in-game with /combatlock reload (requires combatlock.reload)

# Verbose logging of combat locks/unlocks and blocked commands to the console.
# Toggle in-game with /combatlock debug (requires combatlock.reload).
debug: false

combat:
  aggressor-seconds: 15
  defender-seconds: 10

# Players with this permission are never combat-locked (as attacker or victim)
# and their commands are never blocked. Set in plugin.yml, default: op.
bypass-permission: combatlock.bypass

# Commands blocked while a player is combat-locked.
# Match against what the player actually types, WITHOUT the leading slash,
# lower-case. Sub-commands are matched by prefix, so "t spawn" blocks
# "/t spawn" and "/t spawn now" but not "/t spawnprotect".
# Note: this matches the literal command/alias the player types, not the
# resolved command after Bukkit alias resolution - list every alias you use.
blocked-commands:
  - "pw"
  - "pwarp"
  - "t spawn"
  - "town spawn"
  - "warp"
  - "spawn"
  - "tpa"
  - "tp"
  - "home"


# Commands run from the console the moment a player enters (or re-enters)
# combat, keyed by role. %player% is replaced with the player's name.
on-combat-start:
  aggressor:
    - "fly off %player%"
  defender:
    - "fly off %player%"

# Commands run from the console when a player's combat lock naturally expires
# (i.e. they weren't hit again before the timer ran out), keyed by role.
on-combat-end:
  aggressor: []
  defender: []

# Elytra restrictions while combat-locked.
# Cancelling EntityToggleGlideEvent alone is unreliable on modern Paper —
# the client can stay in glide. These options stack for a solid block.
elytra:
  # Cancel starting a glide + force setGliding(false) (now and next tick).
  block-glide: true
  # Cancel PlayerElytraBoostEvent (firework rockets while gliding).
  block-boost: true
  # Prevent equipping an elytra (right-click, inventory click, shift-click, drag).
  block-equip: true
  # Immediately stop gliding when the player enters (or re-enters) combat.
  force-stop-on-combat: true
  # Move equipped elytra into inventory (or drop at feet if full) on combat entry.
  # This is the most reliable way to stop mid-air escape on Paper 26.x.
  unequip-on-combat: true
  # Cancel trident riptide while in combat (spear/trident escapes).
  block-riptide: true

messages:
  command-blocked: "&cYou can't do that while in combat! (&e%time%s&c left)"
  entered-combat-aggressor: "&cYou are in combat as the &4aggressor&c for %time%s."
  entered-combat-defender: "&cYou are in combat as the &4defender&c for %time%s."
  combat-ended: "&aYou are no longer in combat."
  reload-success: "&aCombatLock configuration reloaded."
  no-permission: "&cYou don't have permission to do that."
  elytra-glide-blocked: "&cYou can't use elytra while in combat! (&e%time%s&c left)"
  elytra-equip-blocked: "&cYou can't equip elytra while in combat! (&e%time%s&c left)"
  elytra-boost-blocked: "&cYou can't boost with fireworks while in combat! (&e%time%s&c left)"
  riptide-blocked: "&cYou can't use riptide while in combat! (&e%time%s&c left)"
